spring:
  application:
    name: blog-app-be
  datasource:
    url: jdbc:h2:file:~/blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
app:
  jwt:
    secret: AeuYJNsHQHWD32bdAip8gx0fvsamxKz76UvxdolxNOY= # 256-bit key for HS256
    expiration-ms: 86400000 # 1 day validity
  cors:
    allowed-origins:
      - "http://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - '*'
    allow-credentials: true